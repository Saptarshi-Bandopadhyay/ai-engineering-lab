[project]
name = "ai-engineering-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.140.13",
    "google-genai>=2.17.0",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.52.0",
    "pgvector>=0.5.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.2",
    "sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.ruff]
extend-exclude = [".uv-cache"]

[tool.ruff.lint.flake8-bugbear]
# Allow FastAPI dependencies in function signatures
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint]
ignore = ["BLE001"]
